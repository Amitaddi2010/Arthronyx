[project]
name = "arthronyx"
version = "1.0.0"
description = "Evidence-Structured Orthopedic Intelligence Engine"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "Arthronyx Team"}
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
